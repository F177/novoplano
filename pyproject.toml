[project]
name = "novoplano"
version = "0.1.0"
description = "Dublagem automática em lote de Shorts e Reels EN -> pt-BR"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["packages", "tests"]

# report.py é majoritariamente template HTML/CSS/JS embutido em string;
# quebrar essas linhas em 100 colunas piora a legibilidade.
[tool.ruff.lint.per-file-ignores]
"packages/pipeline/report.py" = ["E501"]
